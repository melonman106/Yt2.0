<style>
/* ==============================================================
   CSS CUSTOM PROPERTIES – THEME SYSTEM
   ============================================================== */
:root {
  /* Brand Colors */
  --yt-red: #ff0000;
  --yt-red-hover: #cc0000;
  --primary: #6366f1;
  --primary-hover: #4f46e5;
  --primary-light: rgba(99, 102, 241, 0.12);
  --primary-glow: rgba(99, 102, 241, 0.35);

  /* Light Theme (default) */
  --bg: #f8f9fc;
  --bg-secondary: #ffffff;
  --bg-tertiary: #f1f3f8;
  --bg-elevated: #ffffff;
  --text: #0f172a;
  --text-secondary: #475569;
  --text-muted: #94a3b8;
  --card: #ffffff;
  --card-hover: #ffffff;
  --border: #e2e8f0;
  --border-light: #f1f5f9;
  --header: rgba(255, 255, 255, 0.85);
  --sidebar: #ffffff;
  --sidebar-hover: #f1f5f9;
  --overlay: rgba(0, 0, 0, 0.5);
  --modal-bg: #0f172a;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.1);
  --shadow-xl: 0 24px 48px rgba(0, 0, 0, 0.14);
  --shadow-glow: 0 0 20px var(--primary-glow);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --radius-full: 9999px;
  --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-slow: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  --font-display: 'Inter', 'Roboto', system-ui, sans-serif;
  --font-body: 'Roboto', 'Inter', system-ui, sans-serif;
  --header-height: 68px;
  --sidebar-width: 272px;
  --glass-blur: 20px;
}

/* Dark Theme */
body.dark-mode {
  --bg: #0f0f0f;
  --bg-secondary: #1a1a1a;
  --bg-tertiary: #222222;
  --bg-elevated: #2a2a2a;
  --text: #f1f5f9;
  --text-secondary: #cbd5e1;
  --text-muted: #64748b;
  --card: #1e1e1e;
  --card-hover: #262626;
  --border: #2e2e2e;
  --border-light: #252525;
  --header: rgba(15, 15, 15, 0.85);
  --sidebar: #1a1a1a;
  --sidebar-hover: #2a2a2a;
  --overlay: rgba(0, 0, 0, 0.75);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.4);
  --shadow-xl: 0 24px 48px rgba(0, 0, 0, 0.5);
}

/* --------------------------------------------------------------
   GLOBAL RESET & BASE
   -------------------------------------------------------------- */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  overflow-x: hidden;
  transition: background var(--transition-normal), color var(--transition-normal);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

a {
  color: inherit;
  text-decoration: none;
}

ul, ol {
  list-style: none;
}

img {
  max-width: 100%;
  height: auto;
  display: block;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
}

input {
  font-family: inherit;
}

/* Scrollbar styling */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--text-muted);
  border-radius: var(--radius-full);
}
::-webkit-scrollbar-thumb:hover {
  background: var(--text-secondary);
}

/* Selection */
::selection {
  background: var(--primary);
  color: #fff;
}

/* --------------------------------------------------------------
   ANIMATED BACKGROUND
   -------------------------------------------------------------- */
.bg-gradient-mesh {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
}

.bg-gradient-mesh .orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.12;
  animation: float-orb 20s ease-in-out infinite;
}

.bg-gradient-mesh .orb:nth-child(1) {
  width: 600px;
  height: 600px;
  background: var(--primary);
  top: -200px;
  right: -100px;
  animation-delay: 0s;
}

.bg-gradient-mesh .orb:nth-child(2) {
  width: 400px;
  height: 400px;
  background: #a855f7;
  bottom: -100px;
  left: -100px;
  animation-delay: -7s;
}

.bg-gradient-mesh .orb:nth-child(3) {
  width: 300px;
  height: 300px;
  background: #ec4899;
  top: 50%;
  left: 50%;
  animation-delay: -14s;
}

body.dark-mode .bg-gradient-mesh .orb {
  opacity: 0.06;
}

@keyframes float-orb {
  0%, 100% { transform: translate(0, 0) scale(1); }
  25% { transform: translate(50px, -30px) scale(1.05); }
  50% { transform: translate(-20px, 50px) scale(0.95); }
  75% { transform: translate(-40px, -20px) scale(1.02); }
}

/* --------------------------------------------------------------
   HEADER
   -------------------------------------------------------------- */
.header {
  position: sticky;
  top: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: var(--header-height);
  padding: 0 32px;
  background: var(--header);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border-bottom: 1px solid var(--border);
  transition: background var(--transition-normal), border-color var(--transition-normal);
}

/* Logo */
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
  flex-shrink: 0;
  padding: 8px 12px;
  border-radius: var(--radius-md);
  transition: background var(--transition-fast);
}

.logo:hover {
  background: var(--bg-tertiary);
}

.logo-icon {
  position: relative;
  width: 36px;
  height: 26px;
  background: var(--yt-red);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform var(--transition-fast);
}

.logo:hover .logo-icon {
  transform: scale(1.05);
}

.logo-icon::after {
  content: '';
  width: 0;
  height: 0;
  border-left: 10px solid #fff;
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
  margin-left: 2px;
}

.logo-text {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, var(--yt-red), #ff6b6b);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* Search Bar */
.search-container {
  display: flex;
  align-items: center;
  flex: 1;
  max-width: 600px;
  margin: 0 32px;
  position: relative;
}

.search-wrapper {
  display: flex;
  align-items: center;
  width: 100%;
  position: relative;
}

.search-input-wrapper {
  display: flex;
  align-items: center;
  flex: 1;
  background: var(--bg-tertiary);
  border: 2px solid var(--border);
  border-radius: var(--radius-full) 0 0 var(--radius-full);
  transition: all var(--transition-normal);
  overflow: hidden;
}

.search-input-wrapper:focus-within {
  border-color: var(--primary);
  background: var(--bg-secondary);
  box-shadow: var(--shadow-glow);
}

.search-icon {
  padding: 0 16px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  transition: color var(--transition-fast);
}

.search-input-wrapper:focus-within .search-icon {
  color: var(--primary);
}

.search-icon svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
}

#search-input {
  flex: 1;
  padding: 12px 0;
  border: none;
  outline: none;
  background: transparent;
  color: var(--text);
  font-size: 15px;
  font-weight: 400;
}

#search-input::placeholder {
  color: var(--text-muted);
}

.search-clear {
  padding: 8px;
  margin-right: 4px;
  border-radius: 50%;
  color: var(--text-muted);
  display: none;
  align-items: center;
  justify-content: center;
  transition: all var(--transition-fast);
}

.search-clear:hover {
  background: var(--bg-tertiary);
  color: var(--text);
}

.search-clear.visible {
  display: flex;
}

.search-clear svg {
  width: 16px;
  height: 16px;
  fill: currentColor;
}

#search-button {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 56px;
  height: 48px;
  background: var(--bg-tertiary);
  border: 2px solid var(--border);
  border-left: none;
  border-radius: 0 var(--radius-full) var(--radius-full) 0;
  color: var(--text-secondary);
  transition: all var(--transition-normal);
}

#search-button:hover {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}

#search-button svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
}

/* Header Actions */
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.header-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: var(--radius-full);
  font-size: 14px;
  font-weight: 500;
  color: var(--text-secondary);
  transition: all var(--transition-fast);
  white-space: nowrap;
}

.header-btn:hover {
  background: var(--bg-tertiary);
  color: var(--text);
}

.header-btn-icon {
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  color: var(--text-secondary);
  transition: all var(--transition-fast);
}

.header-btn-icon:hover {
  background: var(--bg-tertiary);
  color: var(--text);
}

.header-btn-icon svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
}

/* Dark Mode Toggle */
.theme-toggle {
  position: relative;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  transition: all var(--transition-fast);
  overflow: hidden;
}

.theme-toggle:hover {
  background: var(--bg-tertiary);
  color: var(--text);
}

.theme-toggle .icon-sun,
.theme-toggle .icon-moon {
  position: absolute;
  width: 22px;
  height: 22px;
  transition: all var(--transition-normal);
}

.theme-toggle .icon-sun {
  opacity: 0;
  transform: rotate(-90deg) scale(0.5);
}

.theme-toggle .icon-moon {
  opacity: 1;
  transform: rotate(0deg) scale(1);
}

body.dark-mode .theme-toggle .icon-sun {
  opacity: 1;
  transform: rotate(0deg) scale(1);
}

body.dark-mode .theme-toggle .icon-moon {
  opacity: 0;
  transform: rotate(90deg) scale(0.5);
}

/* Sign In Button */
.sign-in-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  border: 2px solid var(--border);
  border-radius: var(--radius-full);
  color: var(--primary);
  font-size: 14px;
  font-weight: 600;
  transition: all var(--transition-fast);
}

.sign-in-btn:hover {
  background: var(--primary-light);
  border-color: var(--primary);
  box-shadow: var(--shadow-glow);
}

.sign-in-btn svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
}

/* --------------------------------------------------------------
   LAYOUT
   -------------------------------------------------------------- */
.layout {
  display: flex;
  padding: 24px 32px;
  gap: 32px;
  max-width: 1800px;
  margin: 0 auto;
}

/* --------------------------------------------------------------
   SIDEBAR
   -------------------------------------------------------------- */
.sidebar {
  width: var(--sidebar-width);
  position: sticky;
  top: calc(var(--header-height) + 24px);
  height: calc(100vh - var(--header-height) - 48px);
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--sidebar);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  padding: 16px 0;
  transition: background var(--transition-normal), border-color var(--transition-normal);
  flex-shrink: 0;
}

.sidebar::-webkit-scrollbar {
  width: 4px;
}

.sidebar-section {
  padding: 8px 12px;
}

.sidebar-section + .sidebar-section {
  margin-top: 8px;
}

.sidebar-item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 11px 16px;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all var(--transition-fast);
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 500;
  position: relative;
  overflow: hidden;
}

.sidebar-item::before {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%) scaleY(0);
  width: 3px;
  height: 60%;
  background: var(--primary);
  border-radius: 0 4px 4px 0;
  transition: transform var(--transition-fast);
}

.sidebar-item:hover {
  background: var(--sidebar-hover);
  color: var(--text);
}

.sidebar-item.active {
  background: var(--primary-light);
  color: var(--primary);
}

.sidebar-item.active::before {
  transform: translateY(-50%) scaleY(1);
}

.sidebar-item .icon {
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 20px;
}

.sidebar-item .icon svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
}

.sidebar-divider {
  height: 1px;
  background: var(--border);
  margin: 12px 20px;
}

.sidebar-title {
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text-muted);
  padding: 12px 20px 4px;
}

.sidebar-channel {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 16px;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all var(--transition-fast);
  color: var(--text-secondary);
  font-size: 14px;
}

.sidebar-channel:hover {
  background: var(--sidebar-hover);
  color: var(--text);
}

.sidebar-channel .avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), #a855f7);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  flex-shrink: 0;
}

/* --------------------------------------------------------------
   CONTENT AREA
   -------------------------------------------------------------- */
.content {
  flex: 1;
  min-width: 0;
}

/* Category / Filter Pills */
.filter-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 24px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}

.filter-bar::-webkit-scrollbar {
  display: none;
}

.filter-pill {
  padding: 8px 18px;
  border-radius: var(--radius-full);
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  transition: all var(--transition-fast);
  border: 1px solid var(--border);
  background: var(--bg-secondary);
  color: var(--text-secondary);
}

.filter-pill:hover {
  background: var(--bg-tertiary);
  color: var(--text);
  border-color: var(--text-muted);
}

.filter-pill.active {
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
}

body.dark-mode .filter-pill.active {
  background: #fff;
  color: #000;
}

/* --------------------------------------------------------------
   VIDEO GRID
   -------------------------------------------------------------- */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 24px 20px;
}

/* --------------------------------------------------------------
   VIDEO CARD
   -------------------------------------------------------------- */
.card {
  background: var(--card);
  border-radius: var(--radius-lg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  cursor: pointer;
  transition: all var(--transition-normal);
  border: 1px solid transparent;
  position: relative;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
  border-color: var(--border);
}

.card:active {
  transform: translateY(-2px);
}

/* Thumbnail */
.thumb {
  position: relative;
  width: 100%;
  padding-top: 56.25%;
  background: var(--bg-tertiary);
  overflow: hidden;
}

.thumb img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform var(--transition-slow);
}

.card:hover .thumb img {
  transform: scale(1.05);
}

/* Thumbnail overlay on hover */
.thumb::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0);
  transition: background var(--transition-normal);
  display: flex;
  align-items: center;
  justify-content: center;
}

.card:hover .thumb::after {
  background: rgba(0, 0, 0, 0.15);
}

.thumb .play-overlay {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  width: 56px;
  height: 56px;
  background: rgba(0, 0, 0, 0.7);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: all var(--transition-normal);
  z-index: 2;
}

.card:hover .play-overlay {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

.thumb .play-overlay svg {
  width: 24px;
  height: 24px;
  fill: #fff;
  margin-left: 3px;
}

/* Duration badge */
.duration {
  position: absolute;
  right: 8px;
  bottom: 8px;
  background: rgba(0, 0, 0, 0.85);
  color: #fff;
  padding: 3px 8px;
  font-size: 12px;
  font-weight: 600;
  border-radius: 6px;
  letter-spacing: 0.3px;
  z-index: 3;
  backdrop-filter: blur(4px);
}

/* Progress bar on thumbnail */
.thumb-progress {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 3px;
  background: rgba(255, 255, 255, 0.2);
  z-index: 3;
}

.thumb-progress-bar {
  height: 100%;
  background: var(--yt-red);
  width: 0%;
  transition: width var(--transition-fast);
}

/* Card Info */
.info {
  display: flex;
  gap: 14px;
  padding: 14px 16px 16px;
  flex-grow: 1;
}

.channel-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  overflow: hidden;
  flex-shrink: 0;
  background: linear-gradient(135deg, var(--primary), #a855f7);
}

.channel-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.titles {
  flex: 1;
  min-width: 0;
}

.title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 15px;
  line-height: 1.4;
  margin: 0 0 6px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  color: var(--text);
  transition: color var(--transition-fast);
}

.card:hover .title {
  color: var(--primary);
}

.meta {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.5;
}

.meta .channel-name {
  font-weight: 500;
  color: var(--text-secondary);
  transition: color var(--transition-fast);
}

.meta .channel-name:hover {
  color: var(--text);
}

.meta .dot {
  display: inline-block;
  width: 3px;
  height: 3px;
  background: var(--text-muted);
  border-radius: 50%;
  margin: 0 6px;
  vertical-align: middle;
}

/* Card menu button */
.card-menu {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.6);
  color: #fff;
  opacity: 0;
  transition: all var(--transition-fast);
  z-index: 4;
}

.card:hover .card-menu {
  opacity: 1;
}

.card-menu:hover {
  background: rgba(0, 0, 0, 0.8);
}

.card-menu svg {
  width: 16px;
  height: 16px;
  fill: currentColor;
}

/* --------------------------------------------------------------
   LOADING STATES
   -------------------------------------------------------------- */
.spinner-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 0;
  gap: 16px;
}

.spinner {
  width: 44px;
  height: 44px;
  border: 3px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

.spinner-text {
  color: var(--text-muted);
  font-size: 14px;
  font-weight: 500;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Skeleton Loading */
.skeleton-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 24px 20px;
}

.skeleton-card {
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.skeleton-thumb {
  width: 100%;
  padding-top: 56.25%;
  background: linear-gradient(90deg, var(--bg-tertiary) 25%, var(--border-light) 50%, var(--bg-tertiary) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s ease-in-out infinite;
}

.skeleton-info {
  display: flex;
  gap: 12px;
  padding: 14px 16px;
}

.skeleton-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(90deg, var(--bg-tertiary) 25%, var(--border-light) 50%, var(--bg-tertiary) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s ease-in-out infinite;
  flex-shrink: 0;
}

.skeleton-lines {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.skeleton-line {
  height: 14px;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--bg-tertiary) 25%, var(--border-light) 50%, var(--bg-tertiary) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s ease-in-out infinite;
}

.skeleton-line:last-child {
  width: 60%;
}

@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* --------------------------------------------------------------
   LOAD MORE BUTTON
   -------------------------------------------------------------- */
.load-more-container {
  display: flex;
  justify-content: center;
  padding: 40px 0;
}

#load-more {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 36px;
  background: linear-gradient(135deg, var(--primary), #7c3aed);
  color: #fff;
  border: none;
  border-radius: var(--radius-full);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition-normal);
  box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
}

#load-more:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
}

#load-more:active {
  transform: translateY(0);
}

#load-more:disabled {
  background: var(--bg-tertiary);
  color: var(--text-muted);
  box-shadow: none;
  cursor: not-allowed;
  transform: none;
}

#load-more svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
}

/* --------------------------------------------------------------
   STATUS / ERROR MESSAGES
   -------------------------------------------------------------- */
.status-container {
  text-align: center;
  padding: 60px 20px;
}

.status-icon {
  font-size: 48px;
  margin-bottom: 16px;
}

.status-title {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--text);
}

.status-message {
  font-size: 15px;
  color: var(--text-muted);
  max-width: 400px;
  margin: 0 auto;
  line-height: 1.6;
}

.status-action {
  margin-top: 20px;
}

.retry-btn {
  padding: 10px 24px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: var(--radius-full);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition-fast);
}

.retry-btn:hover {
  background: var(--primary-hover);
  box-shadow: var(--shadow-glow);
}

/* --------------------------------------------------------------
   MODAL PLAYER
   -------------------------------------------------------------- */
.modal {
  display: none;
  position: fixed;
  z-index: 10000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: var(--overlay);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  justify-content: center;
  align-items: center;
  opacity: 0;
  transition: opacity var(--transition-normal);
}

.modal.visible {
  opacity: 1;
}

.modal-content {
  position: relative;
  background: var(--modal-bg);
  padding: 0;
  width: 90%;
  max-width: 1000px;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-xl);
  overflow: hidden;
  transform: scale(0.95) translateY(20px);
  transition: transform var(--transition-normal);
}

.modal.visible .modal-content {
  transform: scale(1) translateY(0);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.modal-title {
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 80%;
}

.close-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255, 255, 255, 0.7);
  font-size: 28px;
  cursor: pointer;
  transition: all var(--transition-fast);
  flex-shrink: 0;
}

.close-btn:hover {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
}

#player {
  width: 100%;
  height: 0;
  padding-bottom: 56.25%;
  position: relative;
  background: #000;
}

#player iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: none;
}

.modal-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  gap: 12px;
}

.modal-footer-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.btn-yt {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--yt-red);
  color: #fff;
  border: none;
  padding: 10px 20px;
  border-radius: var(--radius-full);
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all var(--transition-fast);
}

.btn-yt:hover {
  background: var(--yt-red-hover);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(255, 0, 0, 0.3);
}

.btn-yt svg {
  width: 16px;
  height: 16px;
  fill: currentColor;
}

.btn-secondary {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
  border: none;
  padding: 10px 20px;
  border-radius: var(--radius-full);
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  transition: all var(--transition-fast);
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.2);
}

.btn-secondary svg {
  width: 16px;
  height: 16px;
  fill: currentColor;
}

/* --------------------------------------------------------------
   TOAST NOTIFICATIONS
   -------------------------------------------------------------- */
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 20000;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.toast {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  animation: slide-in-right 0.3s ease-out;
  max-width: 360px;
}

.toast.hiding {
  animation: slide-out-right 0.3s ease-in forwards;
}

.toast-icon {
  font-size: 18px;
  flex-shrink: 0;
}

@keyframes slide-in-right {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

@keyframes slide-out-right {
  from { transform: translateX(0); opacity: 1; }
  to { transform: translateX(100%); opacity: 0; }
}

/* --------------------------------------------------------------
   BACK TO TOP
   -------------------------------------------------------------- */
.back-to-top {
  position: fixed;
  bottom: 24px;
  left: 24px;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: var(--shadow-md);
  opacity: 0;
  transform: translateY(20px);
  transition: all var(--transition-normal);
  z-index: 9000;
  pointer-events: none;
}

.back-to-top.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.back-to-top:hover {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
  box-shadow: var(--shadow-glow);
}

.back-to-top svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
}

/* --------------------------------------------------------------
   RESPONSIVE
   -------------------------------------------------------------- */
@media (max-width: 1200px) {
  .grid {
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  }
  .skeleton-grid {
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  }
}

@media (max-width: 960px) {
  .header {
    padding: 0 16px;
  }
  .layout {
    flex-direction: column;
    padding: 16px;
    gap: 16px;
  }
  .sidebar {
    width: 100%;
    height: auto;
    order: 2;
    position: static;
    display: flex;
    overflow-x: auto;
    gap: 4px;
    padding: 12px;
    border-radius: var(--radius-md);
  }
  .sidebar::-webkit-scrollbar {
    display: none;
  }
  .sidebar-section {
    display: flex;
    gap: 4px;
    padding: 0;
    flex-shrink: 0;
  }
  .sidebar-section + .sidebar-section {
    margin-top: 0;
    margin-left: 8px;
    padding-left: 8px;
    border-left: 1px solid var(--border);
  }
  .sidebar-item {
    flex-shrink: 0;
    padding: 8px 14px;
    gap: 8px;
  }
  .sidebar-item .text {
    font-size: 13px;
  }
  .sidebar-divider,
  .sidebar-title,
  .sidebar-channel {
    display: none;
  }
  .content {
    order: 1;
  }
  .search-container {
    margin: 0 16px;
  }
  .header-btn span {
    display: none;
  }
  .grid {
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .skeleton-grid {
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
}

@media (max-width: 640px) {
  :root {
    --header-height: 60px;
  }
  .header {
    padding: 0 12px;
  }
  .logo-text {
    font-size: 18px;
  }
  .logo-icon {
    width: 30px;
    height: 22px;
    border-radius: 6px;
  }
  .logo-icon::after {
    border-left-width: 8px;
    border-top-width: 5px;
    border-bottom-width: 5px;
  }
  .search-container {
    margin: 0 8px;
  }
  .search-input-wrapper {
    border-radius: var(--radius-full);
  }
  #search-button {
    display: none;
  }
  .layout {
    padding: 12px;
  }
  .grid {
    grid-template-columns: 1fr;
    gap: 16px;
  }
  .skeleton-grid {
    grid-template-columns: 1fr;
    gap: 16px;
  }
  .filter-bar {
    margin-bottom: 16px;
  }
  .modal-content {
    width: 100%;
    border-radius: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .modal-footer {
    flex-wrap: wrap;
  }
  .modal-header {
    padding: 12px 16px;
  }
  .toast-container {
    left: 16px;
    right: 16px;
    bottom: 16px;
  }
  .toast {
    max-width: 100%;
  }
}

/* --------------------------------------------------------------
   ACCESSIBILITY – Focus styles
   -------------------------------------------------------------- */
*:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
  border-radius: 4px;
}

button:focus-visible,
a:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  html {
    scroll-behavior: auto;
  }
}
</style>

<script>
/* ==============================================================
   CONFIGURATION
   ============================================================== */
const API_KEY      = 'AIzaSyBpElKUXLE826EblN4osqKi42UJepu2QbI';   // <<<---- INSERT YOUR KEY HERE
const MAX_RESULTS  = 12;
let nextPageToken = null;
let currentQuery  = 'most popular';
let currentVideoId = null;

/* --------------------------------------------------------------
   UI ELEMENTS
   -------------------------------------------------------------- */
const searchInput    = document.getElementById('search-input');
const searchButton   = document.getElementById('search-button');
const searchClear    = document.getElementById('search-clear');
const videoGrid      = document.getElementById('video-grid');
const skeletonLoader = document.getElementById('skeleton-loader');
const spinner        = document.getElementById('spinner');
const loadMoreContainer = document.getElementById('load-more-container');
const loadMoreBtn    = document.getElementById('load-more');
const statusMsg      = document.getElementById('status-msg');
const statusIcon     = document.getElementById('status-icon');
const statusTitle    = document.getElementById('status-title');
const statusMessage  = document.getElementById('status-message');
const statusAction   = document.getElementById('status-action');
const retryBtn       = document.getElementById('retry-btn');
const modal          = document.getElementById('player-modal');
const closeModalBtn  = document.getElementById('close-modal');
const playerDiv      = document.getElementById('player');
const openYtBtn      = document.getElementById('open-on-youtube-btn');
const modalVideoTitle = document.getElementById('modal-video-title');
const darkToggle     = document.getElementById('dark-toggle');
const logoBtn        = document.getElementById('logo-btn');
const filterPills    = document.querySelectorAll('.filter-pill');
const sidebarItems   = document.querySelectorAll('.sidebar-item');
const toastContainer = document.getElementById('toast-container');
const backToTop      = document.getElementById('back-to-top');
const shareBtn       = document.getElementById('share-btn');
const copyLinkBtn    = document.getElementById('copy-link-btn');

/* --------------------------------------------------------------
   TOAST NOTIFICATIONS
   -------------------------------------------------------------- */
function showToast(message, icon = '✅', duration = 3000) {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = `<span class="toast-icon">${icon}</span><span>${message}</span>`;
  toastContainer.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('hiding');
    toast.addEventListener('animationend', () => toast.remove());
  }, duration);
}

/* --------------------------------------------------------------
   UTILS
   -------------------------------------------------------------- */
function formatViews(num) {
  if (!num) return '';
  const n = parseInt(num, 10);
  if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B views';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M views';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K views';
  return n + ' views';
}

function timeAgo(dateStr) {
  const d = new Date(dateStr);
  const secs = Math.floor((Date.now() - d) / 1000);
  if (secs < 60) return 'just now';
  const mins = Math.floor(secs / 60);
  if (mins < 60) return mins + ' minute' + (mins > 1 ? 's' : '') + ' ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + ' hour' + (hrs > 1 ? 's' : '') + ' ago';
  const days = Math.floor(hrs / 24);
  if (days < 30) return days + ' day' + (days > 1 ? 's' : '') + ' ago';
  const months = Math.floor(days / 30);
  if (months < 12) return months + ' month' + (months > 1 ? 's' : '') + ' ago';
  return Math.floor(months / 12) + ' year' + (Math.floor(months / 12) > 1 ? 's' : '') + ' ago';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* --------------------------------------------------------------
   BUILD CARD FROM API ITEM
   -------------------------------------------------------------- */
function buildCard(item) {
  const videoId = item.id?.videoId;
  const sn = item.snippet;
  const thumb = sn.thumbnails?.high?.url || sn.thumbnails?.default?.url || '';
  const title = sn.title;
  const channel = sn.channelTitle;
  const pub = sn.publishedAt;
  const channelAvatar = sn.thumbnails?.default?.url || '';

  const fakeDur = `${Math.floor(Math.random() * 20)}:${String(Math.floor(Math.random() * 60)).padStart(2, '0')}`;
  const fakeViews = formatViews(Math.floor(Math.random() * 1_000_000_000));

  const card = document.createElement('article');
  card.className = 'card';
  card.dataset.videoId = videoId;
  card.setAttribute('aria-label', title);
  card.setAttribute('tabindex', '0');
  card.setAttribute('role', 'button');

  card.innerHTML = `
    <div class="thumb">
      <img src="${thumb}" alt="Thumbnail for ${escapeHtml(title)}" loading="lazy">
      <div class="play-overlay">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <span class="duration">${fakeDur}</span>
      <div class="thumb-progress"><div class="thumb-progress-bar"></div></div>
    </div>
    <button class="card-menu" aria-label="More options" onclick="event.stopPropagation()">
      <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
    </button>
    <div class="info">
      <div class="channel-avatar">
        ${channelAvatar ? `<img src="${channelAvatar}" alt="${escapeHtml(channel)} avatar" loading="lazy">` : ''}
      </div>
      <div class="titles">
        <p class="title">${escapeHtml(title)}</p>
        <p class="meta">
          <span class="channel-name">${escapeHtml(channel)}</span>
          <span class="dot"></span>
          <span>${fakeViews}</span>
          <span class="dot"></span>
          <span>${timeAgo(pub)}</span>
        </p>
      </div>
    </div>
  `;

  return card;
}

/* --------------------------------------------------------------
   UI STATE HELPERS
   -------------------------------------------------------------- */
function showSkeleton() {
  skeletonLoader.style.display = '';
  videoGrid.style.display = 'none';
  spinner.style.display = 'none';
  loadMoreContainer.style.display = 'none';
  statusMsg.style.display = 'none';
}

function showGrid() {
  skeletonLoader.style.display = 'none';
  videoGrid.style.display = 'grid';
}

function showSpinner() {
  spinner.style.display = 'flex';
  loadMoreContainer.style.display = 'none';
}

function hideSpinner() {
  spinner.style.display = 'none';
}

function showLoadMore() {
  loadMoreContainer.style.display = 'flex';
}

function hideLoadMore() {
  loadMoreContainer.style.display = 'none';
}

function showStatus(icon, title, message, showRetry = false) {
  skeletonLoader.style.display = 'none';
  videoGrid.style.display = 'none';
  spinner.style.display = 'none';
  loadMoreContainer.style.display = 'none';
  statusMsg.style.display = 'block';
  statusIcon.textContent = icon;
  statusTitle.textContent = title;
  statusMessage.textContent = message;
  statusAction.style.display = showRetry ? '' : 'none';
}

/* --------------------------------------------------------------
   FETCH VIDEOS
   -------------------------------------------------------------- */
async function fetchVideos(query, pageToken = null) {
  if (!pageToken) {
    showSkeleton();
  } else {
    showSpinner();
  }

  if (!API_KEY || API_KEY === 'YOUR_YOUTUBE_DATA_API_KEY' || API_KEY === 'myAPI') {
    showStatus('🔑', 'API Key Required', 'Please add your YouTube Data API key to enable video search.', false);
    return;
  }

  const endpoint = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=${MAX_RESULTS}`
    + `&q=${encodeURIComponent(query)}&type=video&key=${API_KEY}`
    + (pageToken ? `&pageToken=${pageToken}` : '');

  try {
    const resp = await fetch(endpoint);
    if (!resp.ok) {
      const err = await resp.json();
      throw new Error(err.error?.message ?? `HTTP ${resp.status}`);
    }
    const data = await resp.json();

    // Hide skeleton on first load
    if (!pageToken) showGrid();

    // Append cards
    data.items.forEach(item => videoGrid.appendChild(buildCard(item)));

    nextPageToken = data.nextPageToken || null;

    if (nextPageToken) {
      showLoadMore();
    } else {
      hideLoadMore();
    }

    if (!data.items.length && !pageToken) {
      showStatus('🔍', 'No Results Found', 'Try a different search term or browse our categories above.');
    }
  } catch (err) {
    console.error(err);
    if (!pageToken) {
      showStatus('⚠️', 'Something Went Wrong', `Error: ${err.message}`, true);
    } else {
      hideSpinner();
      showLoadMore();
      showToast('Failed to load more videos. Please try again.', '⚠️');
    }
  } finally {
    if (pageToken) hideSpinner();
  }
}

/* --------------------------------------------------------------
   SEARCH HANDLERS
   -------------------------------------------------------------- */
function doSearch() {
  const q = searchInput.value.trim() || 'most popular';
  currentQuery = q;
  videoGrid.innerHTML = '';
  nextPageToken = null;
  fetchVideos(q);
  updateFilterPills(null);
}

function updateFilterPills(activeQuery) {
  filterPills.forEach(pill => {
    pill.classList.toggle('active', activeQuery && pill.dataset.query === activeQuery);
  });
}

searchButton.addEventListener('click', doSearch);
searchInput.addEventListener('keypress', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    doSearch();
  }
});

// Clear search button
searchInput.addEventListener('input', () => {
  searchClear.classList.toggle('visible', searchInput.value.length > 0);
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.classList.remove('visible');
  searchInput.focus();
  doSearch();
});

// Filter pills
filterPills.forEach(pill => {
  pill.addEventListener('click', () => {
    const query = pill.dataset.query;
    currentQuery = query;
    searchInput.value = '';
    searchClear.classList.remove('visible');
    videoGrid.innerHTML = '';
    nextPageToken = null;
    fetchVideos(query);
    filterPills.forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
  });
});

// Retry button
retryBtn.addEventListener('click', () => {
  videoGrid.innerHTML = '';
  nextPageToken = null;
  fetchVideos(currentQuery);
});

// Load more
loadMoreBtn.addEventListener('click', () => {
  if (nextPageToken) {
    fetchVideos(currentQuery, nextPageToken);
  }
});

// Logo click
logoBtn.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.classList.remove('visible');
  doSearch();
});

// Sidebar items
sidebarItems.forEach(item => {
  item.addEventListener('click', () => {
    sidebarItems.forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    const filter = item.dataset.filter;
    const filterMap = {
      'home': 'most popular',
      'explore': 'trending',
      'shorts': 'shorts',
      'subscriptions': 'subscriptions',
      'library': 'library',
      'history': 'history',
      'watch-later': 'watch later',
      'liked': 'liked videos'
    };
    if (filterMap[filter]) {
      currentQuery = filterMap[filter];
      searchInput.value = '';
      searchClear.classList.remove('visible');
      videoGrid.innerHTML = '';
      nextPageToken = null;
      fetchVideos(currentQuery);
      updateFilterPills(null);
    }
  });
});

/* --------------------------------------------------------------
   MODAL PLAYER
   -------------------------------------------------------------- */
function openModal(videoId, title) {
  currentVideoId = videoId;
  modalVideoTitle.textContent = title || 'Video Player';
  modal.style.display = 'flex';
  // Force reflow for animation
  requestAnimationFrame(() => modal.classList.add('visible'));
  document.body.style.overflow = 'hidden';

  const embedUrl = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1`;
  playerDiv.innerHTML = `<iframe src="${embedUrl}"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen title="YouTube video player"></iframe>`;
}

function closeModal() {
  modal.classList.remove('visible');
  setTimeout(() => {
    modal.style.display = 'none';
    playerDiv.innerHTML = '';
    currentVideoId = null;
  }, 300);
  document.body.style.overflow = '';
}

openYtBtn.addEventListener('click', () => {
  if (currentVideoId) {
    window.open(`https://www.youtube.com/watch?v=${currentVideoId}`, '_blank', 'noopener,noreferrer');
  }
});

shareBtn.addEventListener('click', () => {
  if (currentVideoId) {
    const url = `https://www.youtube.com/watch?v=${currentVideoId}`;
    if (navigator.share) {
      navigator.share({ title: modalVideoTitle.textContent, url }).catch(() => {});
    } else {
      navigator.clipboard.writeText(url).then(() => {
        showToast('Link copied to clipboard!', '📋');
      }).catch(() => {});
    }
  }
});

copyLinkBtn.addEventListener('click', () => {
  if (currentVideoId) {
    const url = `https://www.youtube.com/watch?v=${currentVideoId}`;
    navigator.clipboard.writeText(url).then(() => {
      showToast('Link copied to clipboard!', '📋');
    }).catch(() => {
      showToast('Failed to copy link', '⚠️');
    });
  }
});

// Card click handler
videoGrid.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (card && !e.target.closest('.card-menu')) {
    const vid = card.dataset.videoId;
    const title = card.querySelector('.title')?.textContent || '';
    if (vid) openModal(vid, title);
  }
});

// Keyboard support for cards
videoGrid.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    const card = e.target.closest('.card');
    if (card) {
      e.preventDefault();
      const vid = card.dataset.videoId;
      const title = card.querySelector('.title')?.textContent || '';
      if (vid) openModal(vid, title);
    }
  }
});

closeModalBtn.addEventListener('click', closeModal);
window.addEventListener('click', e => {
  if (e.target === modal) closeModal();
});
window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modal.style.display === 'flex') closeModal();
});

/* --------------------------------------------------------------
   DARK MODE TOGGLE
   -------------------------------------------------------------- */
function applyTheme(dark) {
  if (dark) {
    document.body.classList.add('dark-mode');
  } else {
    document.body.classList.remove('dark-mode');
  }
  localStorage.setItem('darkMode', dark ? 'true' : 'false');
}

darkToggle.addEventListener('click', () => {
  const isDark = document.body.classList.contains('dark-mode');
  applyTheme(!isDark);
  showToast(isDark ? 'Light mode enabled' : 'Dark mode enabled', isDark ? '☀️' : '🌙', 2000);
});

const stored = localStorage.getItem('darkMode');
if (stored === 'true') applyTheme(true);

/* --------------------------------------------------------------
   BACK TO TOP
   -------------------------------------------------------------- */
window.addEventListener('scroll', () => {
  backToTop.classList.toggle('visible', window.scrollY > 400);
}, { passive: true });

backToTop.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

/* --------------------------------------------------------------
   INTERSECTION OBSERVER – Lazy loading animation
   -------------------------------------------------------------- */
const observerOptions = {
  root: null,
  rootMargin: '50px',
  threshold: 0.1
};

const cardObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.style.opacity = '1';
      entry.target.style.transform = 'translateY(0)';
    }
  });
}, observerOptions);

// Observe cards as they're added
const gridObserver = new MutationObserver((mutations) => {
  mutations.forEach(mutation => {
    mutation.addedNodes.forEach(node => {
      if (node.classList && node.classList.contains('card')) {
        node.style.opacity = '0';
        node.style.transform = 'translateY(20px)';
        node.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
        cardObserver.observe(node);
      }
    });
  });
});

gridObserver.observe(videoGrid, { childList: true });

/* --------------------------------------------------------------
   INITIAL LOAD
   -------------------------------------------------------------- */
fetchVideos('most popular');
</script>
